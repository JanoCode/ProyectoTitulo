services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:8000"
    environment:
      # La API recibe cada dato por separado. config.py construye una URL segura,
      # incluso si la contraseña contiene caracteres como @, : o /.
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: "${JWT_SECRET}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
