[project]
name = "ergosense"
version = "0.1.0"
description = "Aplicación de escritorio de ErgoSense: monitoreo de actividad y avisos de pausa"
readme = "README.md"
authors = [
    { name = "BastianPinoso", email = "bastianbip@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2,<2",
    "httpx>=0.28,<1",
    "huggingface-hub>=0.34,<3",
    "keyring>=25,<26",
    "mediapipe>=1.1,<2",
    "numpy>=2,<3",
    "pynput>=1.8.2",
    "pyside6>=6.11.2",
    "sounddevice>=0.5,<1",
    "vosk>=0.3.45,<0.4",
    "webrtcvad-wheels>=2.0,<3",
]

[project.scripts]
ergosense = "ergosense.app.main:main"

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12==12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12==12.9.79 ; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
