[project]
name = "ergosense"
version = "0.1.0"
description = "Aplicación de escritorio de ErgoSense: monitoreo de actividad y avisos de pausa"
readme = "README.md"
authors = [
    { name = "BastianPinoso", email = "bastianbip@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "mediapipe>=1.1,<2",
    "pynput>=1.8.2",
    "pyside6>=6.11.2",
    "sounddevice>=0.5,<1",
    "speechrecognition>=3.14,<4",
]

[project.scripts]
ergosense = "ergosense.app.main:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
