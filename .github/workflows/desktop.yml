name: Escritorio
on:
  push:
    paths:
      - 'Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicación/desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicación/desktop/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: 'Fase 2/Evidencias Proyecto/Evidencias de sistema/Aplicación/desktop'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run python -m pytest --cov=ergosense --cov-report=term-missing
