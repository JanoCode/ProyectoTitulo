[project]
name = "ergosense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BastianPinoso", email = "bastianbip@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8.2",
    "pyside6>=6.11.2",
]

[project.scripts]
ergosense = "ergosense:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
